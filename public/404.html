:root{
    --linen:#ffffff; --ink:#1b2340; --red:#c41e3a; --muted:#5d637f;
    --rule:#e2e0d8; --field:#f5f4ef; --code:#eeece4;
    --panel:#1b2340; --panel-fg:#f4f2ea; --panel-muted:#b9bdd0; --panel-field:#27305a; --panel-rule:#3a4470;
    --on-red:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --linen:#12162a; --ink:#ecebe3; --red:#f4647b; --muted:#a3a8c2;
      --rule:#2b3252; --field:#1a2038; --code:#1f2542;
      --panel:#ecebe3; --panel-fg:#12162a; --panel-muted:#4a5070; --panel-field:#dcdbd0; --panel-rule:#b9b8ad;
      --on-red:#12162a;
    }
  }
  :root[data-theme="dark"]{
    --linen:#12162a; --ink:#ecebe3; --red:#f4647b; --muted:#a3a8c2;
    --rule:#2b3252; --field:#1a2038; --code:#1f2542;
    --panel:#ecebe3; --panel-fg:#12162a; --panel-muted:#4a5070; --panel-field:#dcdbd0; --panel-rule:#b9b8ad;
    --on-red:#12162a;
  }

  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{transition:none !important} }
  body{
    margin:0; background:var(--linen); color:var(--ink);
    font-family:"Fraunces", Georgia, "Times New Roman", serif;
    font-optical-sizing:auto; font-size:18px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:underline; text-decoration-color:var(--red); text-underline-offset:3px; text-decoration-thickness:1.5px}
  a:hover{color:var(--red)}
  code{font-family:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size:.88em; background:var(--code); padding:.1em .35em; border-radius:3px}
  :focus-visible{outline:3px solid var(--red); outline-offset:3px}
  img,svg{max-width:100%; height:auto}
  .wrap{max-width:1040px; margin:0 auto; padding:0 24px}
  .measure{max-width:64ch}
  .wrap.measure{max-width:1040px} .wrap.measure > *{max-width:64ch}

  h1,h2,h3{font-weight:600; line-height:1.08; letter-spacing:-.012em; margin:0}
  h2{font-size:2.1rem; margin-bottom:.6em}
  h3{font-size:1.45rem; margin-bottom:.4em}
  p{margin:0 0 1em}
  section{padding:88px 0}
  @media (max-width:720px){ section{padding:60px 0} h2{font-size:1.75rem} body{font-size:17px} }

  /* Nav */
  .nav{position:sticky; top:0; z-index:10; background:var(--linen); border-bottom:1px solid var(--rule)}
  .nav .wrap{display:flex; align-items:center; gap:20px; min-height:60px}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; font-weight:600; white-space:nowrap}
  .brand svg{width:34px; height:17px; display:block}
  .brand:hover{color:inherit}
  .links{display:flex; gap:20px; margin-left:auto; font-size:.95rem}
  .links a{text-decoration:none}
  .links a:hover{text-decoration:underline}
  @media (max-width:720px){
    .nav .wrap{flex-wrap:wrap; gap:4px 16px; padding-top:8px}
    .links{order:3; width:100%; margin-left:0; overflow-x:auto; gap:18px; padding:4px 0 10px; white-space:nowrap; font-size:.9rem}
  }
  .lang{display:flex; gap:2px; margin-left:auto}
  .links + .lang{margin-left:0}
  .lang a{
    font-size:.9rem; font-weight:600; color:var(--muted); text-decoration:none;
    padding:6px 8px; border-bottom:2px solid transparent;
  }
  .lang a:hover{color:var(--red)}
  .lang a[aria-current="page"]{color:var(--ink); border-bottom-color:var(--red)}

  /* Stitch band */
  .band{display:block; width:100%; height:22px}
  .band .k{fill:var(--ink)} .band .r{fill:var(--red)}

  /* Hero */
  .hero{padding:72px 0 64px}
  .hero .wrap{display:grid; grid-template-columns:1.15fr .85fr; gap:48px; align-items:center}
  .kicker{font-style:italic; color:var(--muted); margin-bottom:14px; font-size:1.05rem}
  .hero h1{font-size:clamp(2.9rem, 7.4vw, 5.6rem); font-weight:700; margin-bottom:.35em; letter-spacing:-.02em}
  .lead{font-size:1.2rem; max-width:34em}
  .ctas{display:flex; flex-wrap:wrap; gap:12px; margin:26px 0 14px}
  .fine{color:var(--muted); font-size:.95rem; margin:0}
  .fish{width:100%; max-width:420px; justify-self:end}
  #fish .k{fill:var(--ink)} #fish .r{fill:var(--red)} #fish .w{fill:var(--linen)}
  @media (max-width:840px){
    .hero{padding:40px 0 56px}
    .hero .wrap{grid-template-columns:1fr; gap:28px}
    .fish{order:-1; max-width:240px; justify-self:start}
  }

  /* Buttons */
  .btn{
    display:inline-block; font:inherit; font-weight:600; font-size:1rem; line-height:1.2;
    padding:14px 22px; border-radius:4px; cursor:pointer; text-decoration:none;
    background:var(--red); color:var(--on-red); border:2px solid var(--red);
  }
  .btn:hover{color:var(--on-red); filter:brightness(1.08)}
  .btn.ghost{background:transparent; color:var(--ink); border-color:var(--ink)}
  .btn.ghost:hover{color:var(--red); border-color:var(--red); filter:none}
  .btn.small{padding:8px 14px; font-size:.9rem; border-radius:3px}

  /* Codul */
  .cod ol{list-style:none; padding:0; margin:34px 0 0; border-top:1px solid var(--rule)}
  .cod li{
    display:grid; grid-template-columns:5.2rem 1fr auto; gap:14px; align-items:start;
    padding:18px 0; border-bottom:1px solid var(--rule); scroll-margin-top:80px;
  }
  .cod .art{font-weight:700; white-space:nowrap}
  .cod .copy{
    font:inherit; font-size:.8rem; color:var(--muted); background:none; border:1px solid var(--rule);
    border-radius:3px; padding:4px 9px; cursor:pointer; margin-top:2px;
  }
  .cod .copy:hover{color:var(--red); border-color:var(--red)}
  .cod .copy[data-done="1"]{color:var(--red); border-color:var(--red)}
  .cod li:target{background:var(--field); box-shadow:0 0 0 12px var(--field)}
  @media (max-width:560px){
    .cod li{grid-template-columns:1fr auto; gap:6px 14px}
    .cod .art{grid-column:1; font-size:.95rem}
    .cod .txt{grid-column:1 / -1}
    .cod .copy{grid-column:2; grid-row:1}
  }
  .after{margin-top:26px; color:var(--muted)}

  /* Footer */
  footer{padding:40px 0 48px; color:var(--muted); font-size:.95rem}
  footer .cols{display:flex; flex-wrap:wrap; gap:40px; justify-content:space-between; align-items:flex-start}
  footer ul{list-style:none; padding:0; margin:0; display:flex; flex-wrap:wrap; gap:6px 20px}
  footer ul a{text-decoration:none} footer ul a:hover{text-decoration:underline}
  footer .about{max-width:52ch; color:var(--ink)}
  footer .line{margin-top:34px}

  /* Generic tables (dictionary, Jira, estimates) */
  .tbl{width:100%; border-collapse:collapse; margin-top:26px}
  .tbl th{text-align:left; font-weight:600; padding:10px 0; border-bottom:2px solid var(--ink); font-size:.95rem}
  .tbl td{padding:14px 0; border-bottom:1px solid var(--rule); vertical-align:top}
  .tbl td:first-child{font-style:italic; width:42%; padding-right:24px}
  .tbl th:last-child, .tbl td:last-child{padding-left:12px}
  .tbl td.mono{font-family:"IBM Plex Mono", ui-monospace, Menlo, monospace; font-style:normal; font-size:.92rem}
  h3.sub{margin-top:56px}

  /* Excuse generator */
  .excuse{margin-top:28px; border-left:4px solid var(--red); padding:22px 24px; background:var(--field)}
  .excuse p{font-size:1.35rem; font-style:italic; margin:0 0 18px; min-height:2.4em}
  .excuse .meta{font-size:.85rem; color:var(--muted); margin:14px 0 0}

  /* git log */
  .log{margin-top:26px; background:var(--code); border-radius:4px; padding:18px 20px; overflow-x:auto;
    font-family:"IBM Plex Mono", ui-monospace, Menlo, monospace; font-size:.9rem; line-height:1.7}
  .log .ln{white-space:nowrap}
  .log .h{color:var(--red)}
  .log .g{color:var(--muted); white-space:normal; display:block; padding-left:8ch; font-size:.85rem; line-height:1.4; margin:-2px 0 6px}
  .log .g:empty{display:none}
  .log .prompt{color:var(--muted)}

  /* Standup bingo */
  .bingo{display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-top:22px; max-width:640px}
  .bingo button{
    font:inherit; font-size:.9rem; line-height:1.25; color:var(--ink); background:var(--field);
    border:1.5px solid var(--rule); border-radius:3px; padding:10px 8px; min-height:84px; cursor:pointer; text-align:center
  }
  .bingo button:hover{border-color:var(--red)}
  .bingo button[aria-pressed="true"]{background:var(--red); color:var(--on-red); border-color:var(--red)}
  @media (max-width:560px){ .bingo button{font-size:.78rem; min-height:72px; padding:6px 4px} }
  .bingo-bar{display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:14px}
  .bingo-win{font-weight:600; color:var(--red); margin:0}

  /* CTO: spec sheet, FAQ, reviews */
  .spec{background:var(--panel); color:var(--panel-fg); padding:30px 30px 20px; margin-top:26px}
  .spec h3{font-size:1.35rem; margin-bottom:14px}
  .spec .model{font-family:"IBM Plex Mono", ui-monospace, Menlo, monospace; font-size:.85rem; color:var(--panel-muted); margin-bottom:10px}
  .spec dl{display:grid; grid-template-columns:minmax(9rem, 34%) 1fr; margin:0}
  .spec dt, .spec dd{padding:11px 0; border-top:1px solid var(--panel-rule); margin:0}
  .spec dt{font-weight:600; padding-right:16px}
  .spec dd{font-family:"IBM Plex Mono", ui-monospace, Menlo, monospace; font-size:.9rem}
  @media (max-width:560px){ .spec{padding:22px 18px 14px} .spec dl{grid-template-columns:1fr} .spec dd{border-top:0; padding-top:0} }
  .faq{margin-top:26px; border-top:1px solid var(--rule)}
  .faq details{border-bottom:1px solid var(--rule); padding:16px 0}
  .faq summary{font-weight:600; cursor:pointer; list-style:none; display:flex; gap:12px}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::before{content:"+"; color:var(--red); font-family:"IBM Plex Mono", monospace; width:1ch; flex:none}
  .faq details[open] summary::before{content:"−"}
  .faq details p{margin:10px 0 0 calc(1ch + 12px); color:var(--ink)}
  .reviews{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:20px; margin-top:26px}
  .review{border:1.5px solid var(--rule); padding:22px 22px 18px; margin:0}
  .review .stars{color:var(--red); letter-spacing:2px; margin-bottom:8px}
  .review blockquote{margin:0 0 10px; font-style:italic}
  .review figcaption{font-size:.88rem; color:var(--muted)}
  .disclaimer{font-size:.88rem; color:var(--muted); font-style:italic; margin-top:14px}
  .skip{position:absolute; left:-9999px; top:0; background:var(--red); color:var(--on-red); padding:10px 14px; z-index:20}
  .skip:focus{left:16px; top:10px}
  .faq summary .q{font-size:1rem; line-height:1.45; margin:0; font-weight:600; letter-spacing:0}
  [id]{scroll-margin-top:96px}
  .sprite{position:absolute; width:0; height:0; overflow:hidden}
  .vh{position:absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap}

  /* The cod: blinks when idle, wags and swims on hover, spins on click, parties every 10th click */
  .fish-wrap{position:relative}
  .fishy{display:block; width:100%; padding:0; margin:0; border:0; background:none; color:inherit; cursor:pointer; position:relative; border-radius:4px}
  div.fishy{cursor:default}
  .fishy svg{display:block; width:100%; height:auto; overflow:visible}
  .fishy .k{fill:var(--ink)} .fishy .r{fill:var(--red)} .fishy .w{fill:var(--linen)}
  .fishy .f-tail{transform-box:view-box; transform-origin:264px 78px}
  .fishy .f-eye{transform-box:fill-box; transform-origin:center}
  .fishy .bubble{position:absolute; left:-2%; top:44%; width:10px; height:10px; border:2px solid var(--ink); opacity:0; pointer-events:none}
  .say{
    position:absolute; left:6%; bottom:calc(100% + 6px); margin:0; max-width:92%;
    background:var(--ink); color:var(--linen); padding:8px 12px; border-radius:3px;
    font-family:"IBM Plex Mono", ui-monospace, Menlo, monospace; font-size:.85rem; line-height:1.35
  }
  .say::after{content:""; position:absolute; left:22px; top:100%; border:7px solid transparent; border-top-color:var(--ink)}
  .say:empty{display:none}
  .say{z-index:2}
  @media (max-width:840px){
    .say{bottom:auto; top:calc(100% + 10px)}
    .say::after{top:auto; bottom:100%; border-top-color:transparent; border-bottom-color:var(--ink)}
  }
  @media (prefers-reduced-motion: no-preference){
    .fishy .f-eye{animation:fish-blink 5s infinite}
    .fishy:hover .f-tail, .fishy:focus-visible .f-tail{animation:fish-wag .5s steps(3) infinite alternate}
    .fishy:hover svg, .fishy:focus-visible svg{animation:fish-swim 1.2s ease-in-out infinite}
    .fishy:hover .bubble, .fishy:focus-visible .bubble{animation:fish-bubble 1.8s ease-out infinite}
    .fishy .bubble:nth-of-type(2){animation-delay:.6s !important; width:7px; height:7px}
    .fishy .bubble:nth-of-type(3){animation-delay:1.2s !important; width:12px; height:12px}
    .fishy.spin svg{animation:fish-spin .8s cubic-bezier(.3,1.4,.5,1)}
    .fishy.spin .f-tail{animation:fish-wag .12s steps(2) infinite alternate}
    .fishy.party svg{animation:fish-party 2.4s linear}
    .fishy.party .f-tail{animation:fish-wag .08s steps(2) infinite alternate}
    .say{animation:fish-pop .25s cubic-bezier(.3,1.6,.5,1)}
  }
  @keyframes fish-wag{from{transform:rotate(-18deg)} to{transform:rotate(18deg)}}
  @keyframes fish-swim{0%,100%{transform:translate(0,0) rotate(0)} 25%{transform:translate(-4px,-6px) rotate(-2deg)} 75%{transform:translate(4px,4px) rotate(1.5deg)}}
  @keyframes fish-blink{0%,93%,100%{transform:scaleY(1)} 95%,97%{transform:scaleY(.1)}}
  @keyframes fish-bubble{0%{opacity:0; transform:translate(0,0)} 15%{opacity:1} 100%{opacity:0; transform:translate(-18px,-120px)}}
  @keyframes fish-spin{0%{transform:translateY(0) rotate(0)} 40%{transform:translateY(-40px) rotate(-200deg) scale(1.08)} 100%{transform:translateY(0) rotate(-360deg)}}
  @keyframes fish-party{
    0%{transform:rotate(0) scale(1); filter:hue-rotate(0)}
    20%{transform:translateX(-30px) rotate(-20deg) scale(1.15)}
    40%{transform:translateX(30px) rotate(20deg) scale(.9) scaleX(-1)}
    60%{transform:translateY(-50px) rotate(-340deg) scale(1.2)}
    80%{transform:translateX(-10px) rotate(-360deg) scale(1)}
    100%{transform:rotate(-360deg) scale(1); filter:hue-rotate(720deg)}
  }
  @keyframes fish-pop{from{transform:scale(.6) translateY(8px); opacity:0} to{transform:none; opacity:1}}
</style>
